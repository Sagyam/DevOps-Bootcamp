<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">DevOps &amp; Platform Engineering Bootcamp</title>
  <desc id="d">A 9-week hands-on curriculum: Linux, Docker, CI/CD, Kubernetes, AWS, Observability, Terraform, GitOps and a production Capstone.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <path id="loop" d="M1010,185 C1065,110 1180,110 1180,185 C1180,260 1065,260 1010,185 C955,110 840,110 840,185 C840,260 955,260 1010,185 Z"/>
  </defs>

  <g font-family="'JetBrains Mono','SFMono-Regular','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">

  <!-- window -->
  <rect width="1280" height="440" fill="#0A0A0A"/>
  <rect y="40" width="1280" height="400" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="439" fill="none" stroke="#3A3A3A"/>

  <!-- title bar -->
  <rect x="1" y="1" width="1278" height="39" fill="#141414"/>
  <line x1="0" y1="40" x2="1280" y2="40" stroke="#3A3A3A"/>
  <g fill="none" stroke="#6B6B6B">
    <rect x="20.5" y="15.5" width="10" height="10"/>
    <rect x="38.5" y="15.5" width="10" height="10"/>
    <rect x="56.5" y="15.5" width="10" height="10"/>
  </g>
  <text x="640" y="25" font-size="13" fill="#8A8A8A" text-anchor="middle">sagyam@bootcamp: ~/devops-bootcamp</text>
  <text x="1258" y="25" font-size="13" fill="#5A5A5A" text-anchor="end">bash — 9w</text>

  <!-- prompt -->
  <text x="64" y="92" font-size="16" fill="#8A8A8A"><tspan fill="#FFFFFF">$</tspan> cat README.md</text>

  <!-- title -->
  <text x="62" y="162" font-size="54" font-weight="800" fill="#FFFFFF" textLength="259" lengthAdjust="spacing">DEVOPS &amp;</text>
  <text x="62" y="226" font-size="54" font-weight="800" fill="#FFFFFF" textLength="648" lengthAdjust="spacing">PLATFORM ENGINEERING</text>
  <rect x="724" y="186" width="26" height="44" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="64" y="270" font-size="17" fill="#8A8A8A"># hands-on, production-grade. apply → observe → break → fix</text>

  <!-- devops loop -->
  <use href="#loop" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <use href="#loop" fill="none" stroke="#0A0A0A" stroke-width="3" stroke-dasharray="4 36">
    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="4s" repeatCount="indefinite"/>
  </use>
  <rect x="-5" y="-5" width="10" height="10" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="2" opacity="0">
    <set attributeName="opacity" to="1" begin="0s"/>
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#loop"/></animateMotion>
  </rect>
  <g font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">
    <text x="905" y="193">DEV</text>
    <text x="1115" y="193">OPS</text>
  </g>
  <g font-size="11" letter-spacing="1.5" fill="#7A7A7A" text-anchor="middle">
    <text x="880" y="110">PLAN</text>
    <text x="804" y="189">CODE</text>
    <text x="880" y="270">BUILD</text>
    <text x="968" y="270">TEST</text>
    <text x="1052" y="110">RELEASE</text>
    <text x="1140" y="110">DEPLOY</text>
    <text x="1224" y="189">OPERATE</text>
    <text x="1140" y="270">MONITOR</text>
  </g>

  <!-- curriculum track -->
  <line x1="96" y1="340" x2="1184" y2="340" stroke="#5A5A5A" stroke-width="1.5"/>
  <g text-anchor="middle">
    <g fill="#0A0A0A" stroke="#E5E5E5" stroke-width="1.5">
      <rect x="91" y="335" width="10" height="10"/>
      <rect x="212" y="335" width="10" height="10"/>
      <rect x="333" y="335" width="10" height="10"/>
      <rect x="454" y="335" width="10" height="10"/>
      <rect x="575" y="335" width="10" height="10"/>
      <rect x="696" y="335" width="10" height="10"/>
      <rect x="817" y="335" width="10" height="10"/>
      <rect x="938" y="335" width="10" height="10"/>
      <rect x="1059" y="335" width="10" height="10"/>
      <rect x="1177" y="333" width="14" height="14" fill="#FFFFFF" stroke="#FFFFFF"/>
    </g>
    <g font-size="11" fill="#5A5A5A" letter-spacing="1">
      <text x="96" y="320">00</text><text x="217" y="320">01</text><text x="338" y="320">02</text>
      <text x="459" y="320">03</text><text x="580" y="320">04</text><text x="701" y="320">05</text>
      <text x="822" y="320">06</text><text x="943" y="320">07</text><text x="1064" y="320">08</text>
      <text x="1184" y="320" fill="#FFFFFF">09</text>
    </g>
    <g font-size="13" fill="#D4D4D4">
      <text x="96" y="370">setup</text><text x="217" y="370">linux</text><text x="338" y="370">docker</text>
      <text x="459" y="370">ci/cd</text><text x="580" y="370">kubernetes</text><text x="701" y="370">aws</text>
      <text x="822" y="370">observability</text><text x="943" y="370">terraform</text><text x="1064" y="370">gitops</text>
      <text x="1184" y="370" fill="#FFFFFF" font-weight="700">capstone</text>
    </g>
    <g fill="none" stroke="#3A3A3A">
      <path d="M76,384v6H358v-6"/>
      <path d="M439,384v6H721v-6"/>
      <path d="M802,384v6H1084v-6"/>
      <path d="M1150,384v6H1218v-6"/>
    </g>
    <g font-size="10" letter-spacing="2" fill="#6B6B6B">
      <text x="217" y="410">SYSTEMS &amp; PACKAGING</text>
      <text x="580" y="410">AUTOMATION &amp; ORCHESTRATION</text>
      <text x="943" y="410">OPERATIONS &amp; DELIVERY</text>
      <text x="1184" y="410">SRE</text>
    </g>
  </g>
  </g>
</svg>
