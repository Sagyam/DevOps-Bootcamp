# AUDIT-26
version: "2"

services:
  app:
    build: .
    # AUDIT-27
    ports:
      - "0.0.0.0:3000:3000"
    # AUDIT-28
    volumes:
      - .:/app
    # AUDIT-29
    command: sh -c "sleep 10 && npm start"
    environment:
      - DATABASE_URL=postgres://tiffin:tiffin@db:5432/tiffin
      - ADMIN_PASSWORD=admin
    restart: always

  db:
    # AUDIT-30
    image: postgres:latest
    # AUDIT-31
    ports:
      - "5432:5432"
    environment:
      # AUDIT-32
      - POSTGRES_PASSWORD=tiffin
      - POSTGRES_USER=tiffin
      - POSTGRES_DB=tiffin
    # AUDIT-33
