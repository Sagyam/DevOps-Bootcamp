name: CD

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false # never cancel a deploy mid-flight

jobs:
  publish:
    name: Build, sign and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC: needed for keyless signing and for AWS
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          # Immutable tags. Never 'latest' in production.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Sign the image (keyless, OIDC)
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

  deploy:
    name: Deploy to production
    needs: publish
    runs-on: ubuntu-24.04
    # Requires a human approval configured on the 'production' environment.
    environment:
      name: production
      url: https://tiffin.example.np
    permissions:
      contents: write # to commit the new digest for Argo CD to pick up
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No static AWS keys anywhere. Short-lived credentials via OIDC.
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d181db # v4.2.1
        with:
          role-to-assume: arn:aws:iam::111122223333:role/tiffin-github-deploy
          aws-region: ap-south-1

      # GitOps: CI does not run kubectl. It updates the desired state and
      # Argo CD reconciles. The cluster credentials never leave the cluster.
      - name: Pin the new digest in the prod overlay
        run: |
          cd k8s/overlays/prod
          curl -sSLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz
          tar xf kustomize.tar.gz && rm kustomize.tar.gz
          ./kustomize edit set image tiffin=ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
          rm kustomize
          git config user.name "tiffin-ci"
          git config user.email "ci@tiffin.example.np"
          git commit -am "deploy: ${{ github.ref_name }}"
          git push
