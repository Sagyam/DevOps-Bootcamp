name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. Individual jobs widen this only where needed.
permissions:
  contents: read

# A new push to the same PR cancels the previous run instead of queueing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.17.0'

jobs:
  # --- Gate 1: does it even look right? ------------------------------------
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag. A tag can
      # be moved by the action's author; a SHA cannot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Validate Kubernetes manifests
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          ./kubeconform -strict -summary -ignore-missing-schemas k8s/base k8s/overlays

  # --- Gate 2: does it work? -----------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.9-bookworm
        env:
          POSTGRES_DB: tiffin
          POSTGRES_USER: tiffin
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U tiffin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports: ['5432:5432']
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: tiffin
      PGUSER: tiffin
      PGPASSWORD: ci-only-password
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run migrate
      # No continue-on-error. A failing test fails the build. That is the point.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # --- Gate 3: is it safe? -------------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # required to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks needs history to scan past commits

      - name: Secret scan
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency and IaC scan
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # 0.30.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        if: always()
        with:
          sarif_file: trivy.sarif

      - name: Terraform lint
        run: |
          curl -sSL https://raw.githubusercontent.com/terraform-linters/tflint/v0.58.0/install_linux.sh | bash
          tflint --chdir=terraform --init
          tflint --chdir=terraform --recursive

  # --- Gate 4: does it build? ----------------------------------------------
  build:
    name: Build image
    needs: [quality, test, security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build (no push on PRs)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: tiffin:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the built image
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # 0.30.0
        with:
          image-ref: tiffin:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
