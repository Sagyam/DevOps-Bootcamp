apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tiffin-dev

generatorOptions:
  disableNameSuffixHash: true

resources:
  - ../../base

# Dev runs on Minikube: one replica, no autoscaler, no PDB, and a plain
# Secret instead of External Secrets (there is no AWS here).
replicas:
  - name: tiffin
    count: 1

patches:
  - target: { kind: HorizontalPodAutoscaler, name: tiffin }
    patch: |
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: tiffin
  - target: { kind: PodDisruptionBudget, name: tiffin }
    patch: |
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: tiffin
  - target: { kind: ExternalSecret, name: tiffin-db }
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: tiffin-db

images:
  - name: tiffin
    newName: tiffin
    newTag: dev

configMapGenerator:
  - name: tiffin-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - PGHOST=postgres

# Local-only secret. Generated, not committed as a manifest.
secretGenerator:
  - name: tiffin-db
    literals:
      - password=dev-only-not-a-real-password
