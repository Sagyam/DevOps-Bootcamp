# The database password is stored in AWS Secrets Manager and projected into
# the cluster by the External Secrets Operator. Rotating it in AWS rotates it
# here. Nothing sensitive is committed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tiffin-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: tiffin-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: /tiffin/prod/db
        property: password
