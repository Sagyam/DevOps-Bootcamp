apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tiffin

commonLabels:
  app.kubernetes.io/part-of: tiffin

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - hpa.yaml
  - postgres-statefulset.yaml
  - backup-cronjob.yaml

configMapGenerator:
  - name: tiffin-backup-scripts
    files:
      - scripts/backup.sh
      - scripts/restore.sh
