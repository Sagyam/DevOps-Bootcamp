apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tiffin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tiffin
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      # Scale down slowly to avoid flapping during lunchtime traffic spikes.
      stabilizationWindowSeconds: 300
