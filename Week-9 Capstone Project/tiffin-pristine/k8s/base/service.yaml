apiVersion: v1
kind: Service
metadata:
  name: tiffin
  labels:
    app.kubernetes.io/name: tiffin
spec:
  # ClusterIP. Public exposure is the Ingress's job, not the Service's.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tiffin
  ports:
    - name: http
      port: 80
      targetPort: http
