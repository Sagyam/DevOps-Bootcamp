name: Day 6 - Capstone CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'day6-capstone/**'
      - '.github/workflows/day6-capstone.yml'
      - '.github/actions/setup-node-project/**'
  pull_request:
    paths:
      - 'day6-capstone/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: day6-capstone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Fast feedback: lint + unit tests, no services needed.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-project
        with:
          node-version: '22'
          working-directory: day6-capstone
      - name: Lint
        working-directory: day6-capstone
        run: npm run lint
      - name: Unit tests
        working-directory: day6-capstone
        run: npm run test:unit

  # 2) Integration tests across a matrix, against a Postgres service container.
  integration:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-project
        with:
          node-version: ${{ matrix.node-version }}
          working-directory: day6-capstone
      - name: Integration tests
        working-directory: day6-capstone
        run: npm run test:integration

  # 3) Build the image and push to GHCR — only after all tests pass.
  build:
    needs: integration
    # Don't push images for pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: day6-capstone
          push: true
          tags: ghcr.io/${{ github.repository }}/day6-app:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4) Deploy through a protected environment — the final gate.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ secrets.SSH_HOST }}:3000/health
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            IMAGE=ghcr.io/${{ github.repository }}/day6-app:${{ needs.build.outputs.version }}
            docker pull "$IMAGE"
            docker rm -f day6-app 2>/dev/null || true
            docker run -d --name day6-app -p 3000:3000 \
              -e DATABASE_URL="${{ secrets.APP_DATABASE_URL }}" \
              --restart unless-stopped "$IMAGE"
            echo "Deployed $IMAGE"
