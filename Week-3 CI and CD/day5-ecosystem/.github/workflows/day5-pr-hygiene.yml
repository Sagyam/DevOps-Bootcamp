# Day 5 — "Shopping on the Marketplace, then stringing actions together."
#
# This workflow does something genuinely useful using ONLY marketplace actions
# and GitHub's own APIs — no server, nothing to SSH into, nothing that can page
# you at 4:55pm. It labels a PR by area, labels it by size, and posts a single
# sticky summary comment.
#
# SECURITY: every third-party action is pinned to a full commit SHA, not a tag.
# Tags can be moved; a SHA cannot. See SHA-PINNING.md for the tj-actions story
# that makes this non-negotiable.

name: Day 5 · PR hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "day5-ecosystem/**"
      - ".github/workflows/day5-pr-hygiene.yml"
      - ".github/labeler.yml"

# Least privilege: this job only needs to read code and write to the PR.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Official action. Reads .github/labeler.yml, applies area labels.
      - name: Label by area
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          sync-labels: true

      # THIRD-PARTY specimen. This is the one you make students evaluate:
      # who publishes it? how many repos use it? does it need write access?
      # (it does — that's why we pass the token explicitly and pin the SHA.)
      - name: Label by size
        uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9 # v1.10.4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: "10"
          s_max_size: "100"
          m_max_size: "500"
          l_max_size: "1000"
          fail_if_xl: "false"

      # Official escape hatch: run trusted JS against the GitHub API. Here it
      # finds our own previous comment (by a hidden marker) and edits it in
      # place, so re-runs don't spam the PR.
      - name: Post sticky summary comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const marker = "<!-- day5-pr-hygiene -->";
            const body = [
              marker,
              "### PR hygiene check",
              "",
              "This comment is posted by a workflow that chains three marketplace actions:",
              "- `actions/labeler` — labelled this PR by which area it touches",
              "- `codelytv/pr-size-labeler` — labelled it by size",
              "- `actions/github-script` — wrote this comment (and updates it in place)",
              "",
              "_Every action above is pinned to a commit SHA. Ask yourself why before you copy this into a real repo._",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
