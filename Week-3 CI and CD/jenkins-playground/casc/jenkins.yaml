# Jenkins Configuration as Code (JCasC).
# This one file replaces the entire setup wizard: security, authorization,
# system settings. This is the Jenkins analogue of a GitHub Actions YAML — but
# note it configures the *server*, not a pipeline.

jenkins:
  systemMessage: "Jenkins, configured entirely from code (JCasC). Bootcamp playground — contrast this with GitHub Actions."
  numExecutors: 2
  # A simple built-in user database. Credentials come from env vars (see compose).
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"

