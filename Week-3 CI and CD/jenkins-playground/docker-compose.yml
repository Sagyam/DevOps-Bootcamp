services:
  jenkins:
    build: .
    container_name: jenkins-playground
    ports:
      - "8080:8080"   # web UI
      - "50000:50000" # inbound agents (unused here, handy later)
    environment:
      # These are read by JCasC via ${JENKINS_ADMIN_ID} / ${JENKINS_ADMIN_PASSWORD}.
      JENKINS_ADMIN_ID: "admin"
      JENKINS_ADMIN_PASSWORD: "admin"
    volumes:
      # Mount the JCasC config read-only so you can edit it and just restart.
      - ./casc:/var/jenkins_home/casc:ro
      # No named volume on jenkins_home => every `up` is a clean slate.
      # Uncomment to persist jobs/build history across restarts:
      # - jenkins_home:/var/jenkins_home

# volumes:
#   jenkins_home:
