name: Day 5 - Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'day5-integration/**'
      - '.github/workflows/day5-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never let two deploys run at once; a newer push cancels an in-flight one.
concurrency:
  group: day5-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute a version from the commit
        id: version
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repo name to lowercase
        id: lower-repo
        run: |
          echo "repository=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: day5-deploy
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          # Use the environment variable created in the previous step
          tags: ghcr.io/${{ steps.lower-repo.outputs.repository  }}/day5-app:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  install-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Project Repository Source
        uses: actions/checkout@v4

      - name: Provision Core Docker Context 
        uses: ./.github/actions/install-docker
        with:
          ssh_host: ${{ vars.SSH_HOST }}
          ssh_user: ${{ vars.SSH_USER }}
          ssh_key:  ${{ secrets.SSH_KEY }}

  deploy:
    needs: install-docker
    runs-on: ubuntu-latest
    # Binding to a named environment is what enables approval gates and
    # environment-scoped secrets. Configure protection rules under
    # Settings -> Environments -> production.
    environment:
      name: production
      url: http://${{ vars.SSH_HOST }}:3001/health
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # The remote script pulls the new image and swaps the container.
          # GHCR images from a public repo need no login; private ones would
          # need a `docker login ghcr.io` here using a token secret.
          script: |
            IMAGE=ghcr.io/${{ github.repository }}/day5-app:${{ needs.build.outputs.version }}
            docker pull "$IMAGE"
            docker rm -f day5-app 2>/dev/null || true
            docker run -d --name day5-app -p 3001:3001 --restart unless-stopped "$IMAGE"
            echo "Deployed $IMAGE"
