---
# =============================================================================
# Configure the EC2 instance Terraform just provisioned.
#
# Terraform made the machine EXIST. This playbook makes it CORRECT:
#   1. System updates
#   2. Host firewall (UFW) -- defense in depth behind the security group
#   3. Self-signed TLS certificate
#   4. nginx from nginx.org (Ubuntu's own nginx is too old for HTTP/3)
#   5. Site config: HTTPS, HTTP/2, HTTP/3 with graceful fallback
#   6. Copy the website (HTML lives on YOUR laptop, in files/html/)
#
# Run it twice. The second run should report changed=0. That's idempotency --
# Ansible's version of Terraform's "No changes."
# =============================================================================

- name: Configure web server
  hosts: web
  become: true

  vars:
    web_root: /var/www/chiya
    cert_dir: /etc/nginx/ssl
    cert_days: 365

  tasks:
    # -------------------------------------------------------------------
    # 1. UPDATES
    # -------------------------------------------------------------------
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ufw
          - openssl
          - ca-certificates
          - curl
          - gnupg
          - python3-debian   # required by the deb822_repository module
        state: present

    # -------------------------------------------------------------------
    # 2. FIREWALL
    # The brief says "allow only 80 and 443" -- but if we close 22, this
    # very playbook loses its connection and we brick our own access.
    # We keep 22 open (the security group already restricts WHO can reach
    # it). In real prod you'd allow 22 only from a bastion/VPN CIDR.
    # ORDER MATTERS: allow 22 BEFORE enabling UFW.
    # -------------------------------------------------------------------
    - name: Allow SSH first (never lock yourself out)
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS over TCP (h1/h2)
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Allow HTTPS over UDP (h3/QUIC)
      community.general.ufw:
        rule: allow
        port: "443"
        proto: udp

    - name: Enable UFW, deny everything else inbound
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    # -------------------------------------------------------------------
    # 3. SELF-SIGNED CERTIFICATE
    # `creates:` makes this command idempotent -- it only runs if the
    # cert doesn't exist yet.
    # -------------------------------------------------------------------
    - name: Create certificate directory
      ansible.builtin.file:
        path: "{{ cert_dir }}"
        state: directory
        mode: "0700"

    - name: Generate self-signed certificate
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -newkey rsa:2048
          -days {{ cert_days }}
          -keyout {{ cert_dir }}/chiya.key
          -out {{ cert_dir }}/chiya.crt
          -subj "/C=NP/ST=Bagmati/L=Kathmandu/O=Chiya Shop/CN={{ ansible_host }}"
          -addext "subjectAltName=IP:{{ ansible_host }}"
        creates: "{{ cert_dir }}/chiya.crt"
      notify: Reload nginx

    # -------------------------------------------------------------------
    # 4. NGINX FROM NGINX.ORG
    # Ubuntu 24.04 ships nginx 1.24, which has NO HTTP/3 support.
    # nginx.org's mainline packages (>= 1.25) ship with QUIC built in.
    # -------------------------------------------------------------------
    - name: Add nginx.org mainline repository (modern deb822 format)
      ansible.builtin.deb822_repository:
        name: nginx
        types: deb
        uris: http://nginx.org/packages/mainline/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: nginx
        signed_by: https://nginx.org/keys/nginx_signing.key

    - name: Prefer nginx.org packages over Ubuntu's
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/99nginx
        mode: "0644"
        content: |
          Package: *
          Pin: origin nginx.org
          Pin: release o=nginx
          Pin-Priority: 900

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Verify nginx supports HTTP/3
      ansible.builtin.command: nginx -V
      register: nginx_version
      changed_when: false
      failed_when: "'http_v3_module' not in nginx_version.stderr"

    # -------------------------------------------------------------------
    # 5. SITE CONFIGURATION
    # nginx.org layout: config lives in /etc/nginx/conf.d/*.conf
    # -------------------------------------------------------------------
    - name: Remove default site
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      notify: Reload nginx

    - name: Deploy chiya site config
      ansible.builtin.template:
        src: templates/chiya.conf.j2
        dest: /etc/nginx/conf.d/chiya.conf
        mode: "0644"
        validate: "/bin/sh -c 'nginx -t -c /etc/nginx/nginx.conf'"
      notify: Reload nginx

    # -------------------------------------------------------------------
    # 6. WEBSITE CONTENT -- copied from the control node (your laptop)
    # -------------------------------------------------------------------
    - name: Create web root
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: directory
        owner: nginx
        group: nginx
        mode: "0755"

    - name: Copy HTML pages from host PC to the instance
      ansible.builtin.copy:
        src: files/html/          # trailing slash = copy contents, not the dir
        dest: "{{ web_root }}/"
        owner: nginx
        group: nginx
        mode: "0644"
      notify: Reload nginx

    - name: Ensure nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
