# Day 4 — a Secret. Same shape as a ConfigMap but stored base64-encoded and gated
# by RBAC. We use stringData so you can read the plaintext HERE, then watch the
# cluster store it base64'd (K9s ':secret' -> 'x' decodes it — proving base64 is
# NOT encryption; anyone with 'get secret' rights reads it instantly).
apiVersion: v1
kind: Secret
metadata:
  name: podinfo-secret
type: Opaque
stringData:
  api-token: "s3cr3t-token-do-not-share"
