# ─────────────────────────────────────────────────────────────
# PART 4b — Soft affinity. "Marigold if you have it, rose will do."
#
# Two weighted wishes. The scheduler scores every node, adds the
# weights that match, and picks the winner — but it will still place
# the Pod on a node that matches NEITHER rather than leave it Pending.
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bees
  labels:
    app: bees
spec:
  replicas: 6
  selector:
    matchLabels:
      app: bees
  template:
    metadata:
      labels:
        app: bees
    spec:
      tolerations:
        - key: spray
          operator: Equal
          value: mortein
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: flower
                    operator: In
                    values: [marigold]
            - weight: 20
              preference:
                matchExpressions:
                  - key: flower
                    operator: In
                    values: [rose]
      containers:
        - name: podinfo
          image: stefanprodan/podinfo:6.14.0
          ports:
            - containerPort: 9898
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
