# Day 2 — BREAK-FIX. Same Deployment name as deployment.yaml, so applying this
# triggers a ROLLING UPDATE to a broken image tag. Watch what happens to the
# OLD pods while the new ones fail. (Do not read the tag for the answer — watch
# the rollout and the Events.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: podinfo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: stefanprodan/podinfo:6.14.0-broken   # this tag does not exist
          ports:
            - containerPort: 9898
          readinessProbe:
            httpGet: { path: /readyz, port: 9898 }
            initialDelaySeconds: 3
