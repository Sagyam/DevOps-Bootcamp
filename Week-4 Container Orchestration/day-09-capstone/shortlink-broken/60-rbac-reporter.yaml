apiVersion: v1
kind: ServiceAccount
metadata: { name: viewer, namespace: shortlink }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: pod-viewer, namespace: shortlink }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]                # BUG 8: missing "list"/"watch" -> `kubectl get pods` is Forbidden
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: viewer-binding, namespace: shortlink }
subjects:
  - kind: ServiceAccount
    name: viewer
    namespace: shortlink
roleRef:
  kind: Role
  name: pod-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata: { name: reporter, namespace: shortlink }
spec:
  serviceAccountName: viewer
  containers:
    - name: reporter
      # any kubectl image works; pinned older bitnami tag for stability
      image: bitnami/kubectl:1.28
      command: ["sh", "-c", "while true; do echo '--- pods ---'; kubectl get pods; sleep 20; done"]
