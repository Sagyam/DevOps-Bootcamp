apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: shortlink, labels: { app: redis } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }     # BUG: selector says app=redis ...
  template:
    metadata: { labels: { app: cache } }        # ... but the pods are labelled app=cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: shortlink }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
