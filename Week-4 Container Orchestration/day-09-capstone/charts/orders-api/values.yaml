# Values inherited from the umbrella chart. Defaults let this chart be
# installed standalone too.
global:
  registry: ghcr.io
  owner: REPLACE_ME
  imageTag: latest

replicaCount: 1

image:
  repository: ""          # defaults to <registry>/<owner>/orders-api
  pullPolicy: IfNotPresent

service:
  port: 8080

db:
  host: chiya-db-rw.chiya-data.svc.cluster.local
  # Secret generated by CloudNativePG, copied into this namespace.
  secretName: chiya-db-app

queue:
  addr: valkey.chiya-data.svc.cluster.local:6379

shopName: "Chiya Shop, Kathmandu"

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits:   { memory: 192Mi }

# ---- scheduling -------------------------------------------------------------
nodeSelector:
  tier: app
tolerations: []

antiAffinity:
  enabled: false
  mode: preferred          # "required" makes replicas > nodes go Pending

# ---- scaling ----------------------------------------------------------------
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 60
  scaleDownWindow: 60

pdb:
  enabled: false
  minAvailable: 1

# ---- jobs -------------------------------------------------------------------
migration:
  enabled: true
  image: postgres:17-alpine

rollupCron:
  enabled: true
  schedule: "0 20 * * *"
