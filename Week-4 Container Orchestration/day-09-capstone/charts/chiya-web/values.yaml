global:
  registry: ghcr.io
  owner: REPLACE_ME
  imageTag: latest

replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent

service:
  port: 80

# Injected as /config.js via a ConfigMap. Change it, restart the pods,
# and the UI changes without rebuilding the image.
config:
  ordersApi: "/api"
  kitchenApi: "/api/kitchen"
  tagline: "brewed on Kubernetes"

resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits:   { memory: 96Mi }

nodeSelector:
  tier: app
tolerations: []

antiAffinity:
  enabled: true
  mode: preferred

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 70
  scaleDownWindow: 60
