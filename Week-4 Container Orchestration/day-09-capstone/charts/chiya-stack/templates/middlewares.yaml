{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.compression.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
spec:
  compress:
    minResponseBodyBytes: 512
---
{{- end }}
{{- if .Values.gateway.rateLimit.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
spec:
  rateLimit:
    average: {{ .Values.gateway.rateLimit.average }}
    burst: {{ .Values.gateway.rateLimit.burst }}
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
spec:
  stripPrefix:
    # Order matters: Traefik strips the FIRST prefix that matches.
    #   /api/kitchen/cook -> /cook
    #   /api/orders       -> /orders
    prefixes:
      - /api/kitchen
      - /api
{{- end }}
