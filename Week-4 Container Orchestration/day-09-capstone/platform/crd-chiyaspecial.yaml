# Extending the Kubernetes API with zero code.
#
# Apply this and the API server will store, validate, version and serve a
# brand new kind of object. kubectl, k9s, RBAC, audit logging and every other
# tool you own already know how to handle it -- because to them it is just
# another resource.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chiyaspecials.chiya.example.com
spec:
  group: chiya.example.com
  scope: Namespaced
  names:
    plural: chiyaspecials
    singular: chiyaspecial
    kind: ChiyaSpecial
    shortNames: [cs]
    categories: [chiya]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [flavour, priceNpr]
              properties:
                flavour:
                  type: string
                  maxLength: 60
                priceNpr:
                  type: integer
                  minimum: 10
                  maximum: 500
                spiceLevel:
                  type: string
                  enum: [mild, medium, hot]
                  default: medium
                available:
                  type: boolean
                  default: true
            status:
              type: object
              properties:
                phase:
                  type: string
      # These are what make `kubectl get chiyaspecials` look like a native
      # resource instead of a blob of YAML.
      additionalPrinterColumns:
        - { name: Flavour,   type: string,  jsonPath: .spec.flavour }
        - { name: Price,     type: integer, jsonPath: .spec.priceNpr }
        - { name: Spice,     type: string,  jsonPath: .spec.spiceLevel }
        - { name: Available, type: boolean, jsonPath: .spec.available }
        - { name: Age,       type: date,    jsonPath: .metadata.creationTimestamp }
