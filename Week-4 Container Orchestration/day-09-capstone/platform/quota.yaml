# A namespace is not just a label. Give it a budget and it becomes a boundary.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: chiya-app-quota
  namespace: chiya-app
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    pods: "25"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: chiya-app-defaults
  namespace: chiya-app
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      default:
        memory: 256Mi
