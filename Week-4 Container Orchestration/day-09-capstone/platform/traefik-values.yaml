# Traefik values.
#
# NOTE ON THE SCHEMA
# ------------------
# This chart ships a values.schema.json with additionalProperties: false, and it
# has been tightened repeatedly. Keys that worked last year now hard-fail:
#   ports.web.redirectTo      -> moved to ports.web.http.redirections.entryPoint
#   ports.websecure.tls       -> removed; TLS belongs on the router (our IngressRoute)
#
# So this file deliberately sets only long-stable structural keys and expresses
# everything else as `additionalArguments`, which is an unvalidated list of
# Traefik CLI flags. Less elegant, far more durable.
#
# To see what YOUR chart version accepts:
#   helm show values traefik/traefik > /tmp/tv.yaml

service:
  type: NodePort

ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443

# Pin the gateway to the node whose ports we know.
nodeSelector:
  ingress-ready: "true"

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Static configuration, as CLI flags. These have been stable for years.
additionalArguments:
  # send every plain-HTTP request to HTTPS
  - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
  - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
  # make TLS the default for routers on the websecure entrypoint
  - "--entryPoints.websecure.http.tls=true"
  # access logs: one flag, no sidecar, no code
  - "--accesslog=true"
  - "--log.level=INFO"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 192Mi
