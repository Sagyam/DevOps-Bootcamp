# Production topology. Same charts. Same images. Same cluster.
# Only this file changed.
#
# Expect some orders-api replicas to sit in Pending: anti-affinity is
# `required` and you have fewer app nodes than replicas. That is not a bug,
# it is the scheduler telling you the truth about your capacity.
global:
  registry: ghcr.io
  owner: REPLACE_ME
  imageTag: latest

gateway:
  enabled: true
  compression:
    enabled: true
  rateLimit:
    enabled: true       # <- six lines below turn on 429s
    average: 5
    burst: 10

chiya-web:
  replicaCount: 3
  antiAffinity:
    enabled: true
    mode: preferred

orders-api:
  replicaCount: 4
  antiAffinity:
    enabled: true
    mode: required
  pdb:
    enabled: true
    minAvailable: 2

kitchen-api:
  replicaCount: 2
  antiAffinity:
    enabled: true
    mode: preferred
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPU: 60
    scaleDownWindow: 60
  pdb:
    enabled: true
    minAvailable: 1
