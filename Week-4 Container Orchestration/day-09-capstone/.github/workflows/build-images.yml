name: build-images

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [chiya-web, orders-api, kitchen-api]
    steps:
      - uses: actions/checkout@v7

      # OCI reference names MUST be lowercase. GitHub usernames often are not.
      # Skip this and you get a very unhelpful "invalid reference format".
      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: reminder
        run: |
          echo "::notice::Pushed ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.app }}"
          echo "::warning::GHCR packages are PRIVATE by default. Go to your profile -> Packages -> ${{ matrix.app }} -> Package settings -> Change visibility -> Public"
