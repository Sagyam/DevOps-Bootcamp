# Ingress (Day 8): two hosts. shortlink.local -> frontend, api.shortlink.local -> api.
# Add both to /etc/hosts pointing at `minikube ip`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortlink
  namespace: shortlink
spec:
  ingressClassName: nginx
  rules:
    - host: shortlink.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
    - host: api.shortlink.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api, port: { number: 80 } } }
