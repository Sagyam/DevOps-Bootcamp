# A tiny Postgres so the migration Job has something real to talk to.
# Not production shaped -- no PVC, no HA. Part 4 replaces this with an operator.
apiVersion: v1
kind: Service
metadata:
  name: chiya-db
  namespace: jobs-lab
spec:
  selector:
    app: chiya-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chiya-db
  namespace: jobs-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chiya-db
  template:
    metadata:
      labels:
        app: chiya-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: chiya123           # demo only. Part 4 shows Secrets done properly.
            - name: POSTGRES_DB
              value: chiya
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          emptyDir: {}
