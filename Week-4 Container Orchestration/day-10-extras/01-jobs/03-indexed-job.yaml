# Indexed Job: each Pod gets a stable index injected as JOB_COMPLETION_INDEX.
# Use this when the work can be sharded by number (partition 0..N-1),
# e.g. "re-process shard 3 of 5". Pod names end in -0, -1, -2 ...
apiVersion: batch/v1
kind: Job
metadata:
  name: shard-report
  namespace: jobs-lab
spec:
  completionMode: Indexed
  completions: 5
  parallelism: 5
  backoffLimit: 1
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "I am shard ${JOB_COMPLETION_INDEX} of 5"
              sleep $(( (JOB_COMPLETION_INDEX + 1) * 3 ))
              echo "shard ${JOB_COMPLETION_INDEX} finished"
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
