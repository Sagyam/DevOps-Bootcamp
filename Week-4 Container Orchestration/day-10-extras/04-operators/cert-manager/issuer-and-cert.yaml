# These are the CUSTOM RESOURCES the cert-manager operator watches.
# Nothing here is Helm. This is the "user-facing API" the operator installed.
#
# Chain:  ClusterIssuer(selfsigned) -> Certificate(CA) -> ClusterIssuer(ca) -> Certificate(leaf)
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# A self-signed root CA. Lives in the operator's namespace because
# a ClusterIssuer reads its secret from there.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: chiya-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: chiya-shop-ca
  secretName: chiya-ca-keypair
  duration: 8760h        # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: chiya-ca
spec:
  ca:
    secretName: chiya-ca-keypair
---
# The leaf certificate an app would actually mount.
# Watch the operator create the Secret for you within seconds.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: chiya-web-tls
  namespace: chiya-dev
spec:
  secretName: chiya-web-tls        # <- operator creates this Secret
  duration: 720h                   # 30 days
  renewBefore: 696h                # renew after ~1 day, so you can SEE rotation
  commonName: chiya.local
  dnsNames:
    - chiya.local
    - chiya-web.chiya-dev.svc.cluster.local
  issuerRef:
    name: chiya-ca
    kind: ClusterIssuer
    group: cert-manager.io
