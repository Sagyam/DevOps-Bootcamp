# Container declares NO resources at all.
# Apply this AFTER the quota but BEFORE the LimitRange and watch it fail.
# Then apply the LimitRange, `kubectl rollout restart`, and watch it succeed
# with defaults silently injected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chiya-api
  namespace: chiya-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chiya-api
  template:
    metadata:
      labels:
        app: chiya-api
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.0
          ports:
            - name: http
              containerPort: 9898
