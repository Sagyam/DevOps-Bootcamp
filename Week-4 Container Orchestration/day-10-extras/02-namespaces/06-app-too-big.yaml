# Two separate violations in one manifest -- read the rejection message carefully
# to work out which rule bit first:
#   * 2 CPU per container  > LimitRange max (1)
#   * 3 replicas x 2 CPU   > ResourceQuota requests.cpu (1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chiya-greedy
  namespace: chiya-dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chiya-greedy
  template:
    metadata:
      labels:
        app: chiya-greedy
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.0
          resources:
            requests: { cpu: "2", memory: 1Gi }
            limits:   { cpu: "2", memory: 2Gi }
