# Day 1 — BREAK-FIX.
# Everything here is valid YAML and a valid Pod spec. Kubernetes will accept it
# happily. But the image tag does not exist, so the container can never start.
# Your job: apply it, then diagnose WHY it's stuck using only what the cluster
# tells you (K9s 'd' to describe, or `kubectl describe`). Do NOT fix it by reading
# this comment — find the answer in the Events, the way you will in real life.
apiVersion: v1
kind: Pod
metadata:
  name: podinfo-broken
  labels:
    app: podinfo
spec:
  containers:
    - name: podinfo
      image: stefanprodan/podinfo:6.14.0-does-not-exist
      ports:
        - containerPort: 9898b