# Day 3 — the workload we'll put a Service in front of.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: stefanprodan/podinfo:6.14.0
          ports:
            - containerPort: 9898
          resources:
            limits:
              cpu: "1"      # 1 CPU core
              memory: "512Mi" # 512 Megabytes
            requests:
              cpu: "0.5"    # 0.5 CPU core
              memory: "256Mi" # 256 Megabytes
