# Day 8 — BREAK-FIX. Same Ingress name ("web"), so applying this REPLACES the good
# one. podinfo.local now points at a port the service doesn't expose -> 503.
# Trace the chain: Ingress -> Service -> Endpoints -> Pod. The break is one line.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: nginx
  rules:
    - host: podinfo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podinfo
                port:
                  number: 9999      # the podinfo Service only listens on 80
