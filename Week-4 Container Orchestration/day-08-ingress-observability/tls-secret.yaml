# Day 8 — a TLS Secret for the Ingress. THROWAWAY self-signed cert for the lab only
# (CN/SAN = podinfo.local, whoami.local). In real life you'd never commit a key;
# you'd run: kubectl create secret tls web-tls --cert=tls.crt --key=tls.key
apiVersion: v1
kind: Secret
metadata:
  name: web-tls
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
