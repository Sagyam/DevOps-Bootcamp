# Day 6 — podinfo done "production-real": liveness + readiness probes and
# resource requests/limits. Includes a Service so the load generator and HPA work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: stefanprodan/podinfo:6.14.0
          ports:
            - containerPort: 9898
          livenessProbe:            # "is it wedged? restart it."
            httpGet: { path: /healthz, port: 9898 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:           # "is it ready for traffic? if not, pull it from the Service."
            httpGet: { path: /readyz, port: 9898 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 64Mi }   # what the scheduler reserves
            limits:   { cpu: 20m, memory: 128Mi }  # the hard ceiling
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
spec:
  selector:
    app: podinfo
  ports:
    - port: 80
      targetPort: 9898
