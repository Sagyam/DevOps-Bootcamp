# Provisioned datasources. Grafana reads this on startup, so nobody has to
# click through a setup wizard -- and more importantly, the configuration is
# in git rather than in one person's browser.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    # A fixed uid matters: the dashboard JSON files reference datasources by
    # uid. Let Grafana generate a random one and your dashboards break on a
    # fresh install.
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
