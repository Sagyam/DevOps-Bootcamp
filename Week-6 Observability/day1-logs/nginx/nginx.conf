# ===========================================================================
# nginx as a load balancer in front of two API replicas.
#
# It is here for two reasons:
#   1. It is the first thing a request touches, so its access log is the most
#      honest record of what users experienced. If the app never got the
#      request, the app's logs cannot tell you that. nginx can.
#   2. It generates the request id that ties the whole story together.
# ===========================================================================

worker_processes auto;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  # -------------------------------------------------------------------------
  # STRUCTURED ACCESS LOGS
  #
  # The default nginx log format ("combined") is a space-separated line built
  # for humans with grep. Parsing it later means regex, and regex breaks the
  # first time a user-agent contains a quote. So we emit JSON instead.
  #
  # `escape=json` is mandatory: it makes nginx escape quotes and backslashes
  # inside variables. Without it, one weird user-agent produces a malformed
  # line and your log parser starts dropping records silently.
  #
  # We hardcode "level":"info" so nginx lines carry the same field as the
  # application's pino lines. One schema across the whole system means one
  # dashboard query works everywhere.
  # -------------------------------------------------------------------------
  log_format json_access escape=json
    '{'
      '"level":"info",'
      '"service":"nginx",'
      '"time":"$time_iso8601",'
      '"requestId":"$request_id",'
      '"method":"$request_method",'
      '"path":"$uri",'
      '"query":"$args",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"requestTime":$request_time,'
      '"upstreamTime":"$upstream_response_time",'
      '"upstream":"$upstream_addr",'
      '"clientIp":"$remote_addr",'
      '"userAgent":"$http_user_agent",'
      '"msg":"http request"'
    '}';

  # /dev/stdout, not a file. In containers, logs are a stream you hand to the
  # runtime -- not a file you rotate. The official nginx image already
  # symlinks these, but being explicit costs one line and saves an argument.
  access_log /dev/stdout json_access;

  sendfile on;
  keepalive_timeout 65;

  # -------------------------------------------------------------------------
  # DNS-BASED LOAD BALANCING
  #
  # `api` resolves to two container IPs because docker-compose.yml asks for
  # two replicas. If we wrote a normal `upstream` block, nginx would resolve
  # `api` once at startup and pin itself to whichever IP it got first --
  # replicas would never receive traffic and you would spend the session
  # wondering why.
  #
  # 127.0.0.11 is Docker's embedded DNS server, present in every user-defined
  # network. Putting the address in a VARIABLE forces nginx to re-resolve it,
  # honouring the 5s TTL, so both replicas get traffic.
  #
  # (Because proxy_pass takes a variable, nginx no longer appends the request
  # path automatically -- hence the explicit $request_uri.)
  # -------------------------------------------------------------------------
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8080;

    location / {
      set $api_upstream "http://api:3000";
      proxy_pass $api_upstream$request_uri;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # THE important line. $request_id is a unique hex string nginx generates
      # per request. Handing it to the app means the nginx access log and every
      # application log line for this request share one id.
      proxy_set_header X-Request-Id      $request_id;

      # And send it back to the client, so a user reporting a problem can give
      # you the exact id to search for.
      add_header X-Request-Id $request_id always;
    }
  }
}
